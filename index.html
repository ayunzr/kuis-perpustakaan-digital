<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis 10 Soal - Perpustakaan Digital</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}h1{font-family:'Fraunces',serif}</style>
</head>
<body class="bg-[#f8f5ff] min-h-screen p-4">
<div class="max-w-2xl mx-auto">
<div class="text-center py-6">
<div class="bg-white border shadow-sm inline-block px-4 py-1 rounded-full text-[10px] font-bold tracking-widest">📚 KUIS 10 SOAL - MATERI KELAS</div>
<h1 class="text-4xl font-extrabold mt-4 leading-none">Perpustakaan<br><span class="text-violet-600">Digital</span></h1>
<p class="text-sm text-slate-500 mt-2">Jawab 10 soal, lihat skor kamu!</p>
</div>
<div class="bg-white rounded-[28px] shadow-xl border p-6">
<div class="flex items-center gap-3 mb-5">
<span id="qNum" class="bg-slate-900 text-white text-xs px-3 py-1 rounded-full font-bold">1/10</span>
<div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div id="bar" class="h-full bg-violet-600 transition-all" style="width:10%"></div></div>
<span id="skor" class="text-xs font-bold bg-violet-100 text-violet-700 px-3 py-1 rounded-full">Skor 0</span>
</div>
<div id="quiz"></div>
</div>
</div>
<script>
const soal=[
{q:"Apa tujuan utama dari penerapan sistem manajemen perpustakaan modern?",a:["Memperluas gedung","Meningkatkan efisiensi layanan & akses informasi","Mengurangi kunjungan","Mengganti pustakawan dengan AI"],k:1,p:"Fokus utamanya efisiensi layanan dan kemudahan akses."},
{q:"Apa yang dimaksud dengan Digital Library?",a:["Buku cetak sampul digital","Perpustakaan tanpa gedung","Koleksi digital yang diakses via jaringan komputer","Koleksi pribadi yang dipindai"],k:2,p:"Digital library = koleksi digital yang bisa diakses online."},
{q:"Standar metadata yang paling umum untuk perpustakaan digital?",a:["MARC21","Dublin Core","ISBN","ISSN"],k:1,p:"Dublin Core paling populer karena sederhana."},
{q:"Keuntungan utama RFID dibanding barcode?",a:["Lebih murah","Baca banyak item sekaligus tanpa garis pandang","Tidak butuh hardware","Hapus inventaris"],k:1,p:"RFID bisa scan 10+ buku sekaligus."},
{q:"Fungsi utama ILS (Integrated Library System)?",a:["Atur suhu ruangan","Integrasi sirkulasi, katalog, pengadaan, anggota","Kelola sosmed","Kelola keuangan kampus"],k:1,p:"ILS menyatukan semua fungsi perpustakaan."},
{q:"Tantangan terbesar digitalisasi naskah kuno?",a:["Kurang minat baca","Risiko kerusakan fisik & biaya tinggi","Sulit upload","Tidak ada software"],k:1,p:"Naskah kuno rapuh, butuh alat & biaya khusus."},
{q:"Apa itu Open Access?",a:["Akses gratis legal untuk baca & unduh karya ilmiah","Buka 24 jam","Boleh bawa buku bebas","Anggota gratis"],k:0,p:"Open Access = ilmu gratis untuk semua."},
{q:"Software populer untuk repositori institusi?",a:["MS Word","DSpace / EPrints","Photoshop","Google Docs"],k:1,p:"DSpace & EPrints dipakai ribuan kampus."},
{q:"Apa fungsi OPAC dalam perpustakaan digital?",a:["Katalog online untuk telusur koleksi oleh pemustaka","Alat peminjaman offline","Pengatur rak buku","Aplikasi kasir"],k:0,p:"OPAC = Online Public Access Catalog, untuk cari buku online."},
{q:"Mengapa preservasi digital itu penting?",a:["Agar koleksi digital tetap bisa dibaca jangka panjang","Agar file lebih besar","Agar tidak perlu backup","Agar bisa dijual"],k:0,p:"Format digital bisa rusak/usang, perlu preservasi agar tetap awet."}
];
let idx=0,sk=0;
const quiz=document.getElementById('quiz'),bar=document.getElementById('bar'),qNum=document.getElementById('qNum'),skorEl=document.getElementById('skor');
function render(){
if(idx>=soal.length){
quiz.innerHTML=`<div class="text-center py-8"><div class="text-6xl mb-3">🏆</div><h2 class="text-2xl font-extrabold">Skor: ${sk}/10</h2><p class="text-sm text-slate-500 mt-2">${sk>=8?'Luar biasa! Materi kelas kamu kuasai!':sk>=6?'Keren! Lanjut pertahankan!':'Semangat, coba lagi!'}</p><button onclick="idx=0;sk=0;render()" class="mt-6 bg-slate-900 text-white px-8 py-3 rounded-full font-bold">🔁 Ulangi</button></div>`;return;
}
let s=soal[idx];
quiz.innerHTML=`<h2 class="font-bold text-[17px] mb-4 leading-snug">${idx+1}. ${s.q}</h2><div class="space-y-2">${s.a.map((t,i)=>`<button onclick="jawab(${i})" class="w-full text-left p-4 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:border-violet-400 hover:bg-violet-50 transition text-sm font-medium"> <span class="font-bold mr-2">${String.fromCharCode(65+i)}.</span>${t}</button>`).join('')}</div><div id="fb" class="mt-4"></div>`;
bar.style.width=`${(idx/10)*100}%`; qNum.innerText=`${idx+1}/10`; skorEl.innerText=`Skor ${sk}`;
}
function jawab(p){
let s=soal[idx]; let fb=document.getElementById('fb'); let btns=quiz.querySelectorAll('button');
btns.forEach((b,i)=>{b.disabled=true; if(i==s.k) b.className="w-full text-left p-4 rounded-2xl border-2 border-emerald-400 bg-emerald-50 text-sm font-medium"; else if(i==p) b.className="w-full text-left p-4 rounded-2xl border-2 border-red-300 bg-red-50 text-sm font-medium";});
if(p==s.k){sk++; fb.innerHTML=`<div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-sm"><b>✅ Benar!</b> ${s.p}</div>`}else{fb.innerHTML=`<div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-sm"><b>Jawaban: ${String.fromCharCode(65+s.k)}</b> ${s.p}</div>`}
skorEl.innerText=`Skor ${sk}`; setTimeout(()=>{idx++; render();},1500);
}
render();
</script>
</body>
</html>
